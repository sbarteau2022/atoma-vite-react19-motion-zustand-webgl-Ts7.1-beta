<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Mark A "Toroid": round 1 disciplined. Three orbits at exact 60-degree
       spacing, one weight, amber hub. An atom that is also a torus. -->
  <g stroke-width="3" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="25" ry="10" stroke="#4fe3ea"/>
    <ellipse cx="32" cy="32" rx="25" ry="10" stroke="#4fe3ea" opacity="0.6" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="25" ry="10" stroke="#f0a832" transform="rotate(120 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="8.6" stroke="#e9eded" stroke-opacity="0.35" stroke-width="1.1"/>
  <circle cx="32" cy="32" r="4.6" fill="#f0a832"/>
</svg>
