    <ellipse cx="32" cy="32" rx="26" ry="10.5" stroke="#f0a832" transform="rotate(96 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="5.2" fill="#f0a832"/>
  <circle cx="32" cy="32" r="9.5" stroke="#e9eded" stroke-opacity="0.35" stroke-width="1.2"/>
